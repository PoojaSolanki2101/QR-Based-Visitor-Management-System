<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visitor Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1d3557;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #1d4ed8;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        .success {
            text-align: center;
            color: green;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Visitor Registration</h1>

    <p class="success" th:if="${param.success}">
        Visitor registered successfully!
    </p>

    <form th:action="@{/register}" method="post">

        <!-- CSRF Token -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}">

        <label>Visitor Name</label>
        <input type="text" name="name" required>

        <label>Mobile Number</label>
        <input type="tel" name="mobile" required>

        <label>Email</label>
        <input type="email" name="email">

        <label>Person to Meet</label>
        <input type="text" name="personToMeet" required>

        <label>Purpose of Visit</label>
        <textarea name="purpose" rows="3" required></textarea>

        <button type="submit">Register Visitor</button>

    </form>

</div>

</body>
</html>
