<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visitor QR Scanner</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #cccccc;
        }

        h1 {
            color: #1e3a5f;
        }

        #reader {
            width: 100%;
            max-width: 450px;
            margin: 20px auto;
        }

        #result {
            margin: 20px;
            font-weight: bold;
            color: #15803d;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #1d4ed8;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Visitor QR Scanner</h1>

    <p>Camera ke saamne visitor ka QR code scan karein.</p>

    <div id="reader"></div>

    <p id="result">Waiting for QR code...</p>

    <a th:href="@{/visitors}">Back to Dashboard</a>

</div>

<script>
    let scanner = new Html5Qrcode("reader");
    let isScanned = false;

    function onScanSuccess(decodedText) {

        if (isScanned) {
            return;
        }

        isScanned = true;

        document.getElementById("result").textContent =
            "QR Code Scanned: " + decodedText;

        scanner.stop().then(function () {

            const match = decodedText.match(/^VISITOR_ID:(\d+)$/);

            if (!match) {
                document.getElementById("result").textContent =
                    "Invalid Visitor QR Code!";
                isScanned = false;
                return;
            }

            const visitorId = match[1];

            window.location.href = "/scan-visitor/" + visitorId;

        }).catch(function (error) {
            console.error(error);
        });
    }

    Html5Qrcode.getCameras().then(function (cameras) {

        if (cameras && cameras.length) {

            scanner.start(
                cameras[0].id,
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 }
                },
                onScanSuccess
            ).catch(function (error) {
                document.getElementById("result").textContent =
                    "Camera start nahi hua. Camera permission check karein.";
            });

        } else {
            document.getElementById("result").textContent =
                "Camera nahi mila.";
        }

    }).catch(function (error) {
        document.getElementById("result").textContent =
            "Camera access nahi mila. Browser permission check karein.";
    });
</script>

</body>
</html>
